<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5a3e2b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>유기동물 스토리</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<link rel="stylesheet" href="assets/game.css?v=0.15.2">
</head>
<body>
<!-- artifact:start -->
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <span class="date"><span id="shelter-name" class="shelter-name"></span><span id="date">1년차 1월 1주</span></span>
      <div class="speed" role="group" aria-label="게임 속도">
        <button type="button" data-speed="0" aria-label="일시정지">||</button>
        <button type="button" data-speed="1" aria-label="1배속">▶</button>
        <button type="button" data-speed="2" aria-label="2배속">▶▶</button>
        <button type="button" data-speed="4" aria-label="4배속">▶▶▶</button>
      </div>
    </div>
    <div id="site-tabs" hidden role="group" aria-label="지점"></div>
    <div class="hud-row stats">
      <span>자금 <b id="money">0</b></span>
      <span>평판 <b id="rep">0</b></span>
      <span>인식 <b id="aware">0</b></span>
      <span>후원자 <b id="donors">0</b></span>
      <span id="cap-chip">수용 <b id="cap">0/0</b></span>
    </div>
  </header>

  <button type="button" id="ticker" aria-label="SNS 피드 열기">
    <span class="tag">SNS</span><span id="ticker-text">불러오는 중</span>
  </button>

  <div id="stage">
    <div id="game"></div>
    <button type="button" id="rotate-btn" aria-label="시점 돌리기" title="시점 돌리기">⟲</button>
    <div id="build-hint" hidden>
      <span id="build-hint-text">지을 칸을 누르세요</span>
      <button type="button" id="build-cancel">그만 짓기</button>
    </div>
  </div>

  <!-- 분기 보고서 제출: 분기가 끝나면 반짝이며 나타난다 -->
  <button type="button" id="report-btn" hidden>분기 보고서 제출</button>

  <nav id="dock" aria-label="메뉴">
    <button type="button" data-sheet="build">건설</button>
    <button type="button" data-sheet="animals">동물</button>
    <button type="button" data-sheet="people">사람</button>
    <button type="button" data-sheet="goods">물품</button>
    <button type="button" data-sheet="manage">경영</button>
    <button type="button" data-sheet="album">앨범</button>
  </nav>

  <section id="sheet" hidden aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" id="sheet-close">닫기</button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <!-- 사건 카드: 게임을 멈추고 가운데에 짧게 소개한다. 아무 곳이나 누르면 계속 -->
  <div id="event" hidden role="dialog" aria-modal="true" aria-labelledby="event-title">
    <button type="button" id="event-card">
      <span id="event-art" aria-hidden="true"></span>
      <span id="event-title"></span>
      <span id="event-body"></span>
      <span class="event-next">눌러서 계속</span>
    </button>
  </div>

  <!-- 선택 창: 고르지 않으면 진행하지 않는 일(수술, 이송, 제안)과 분기 보고서 -->
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="box">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <!-- 시작 화면: 경력 고르기 → 인트로 -->
  <div id="start" hidden>
    <div class="start-inner" id="start-inner"></div>
  </div>

  <!-- 튜토리얼 안내 말풍선 -->
  <div id="coach" hidden role="status">
    <p id="coach-text"></p>
    <div class="coach-btns"><button type="button" id="coach-skip">안내 건너뛰기</button><button type="button" id="coach-next" hidden>다음</button></div>
  </div>

  <div id="toasts" aria-live="polite"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js" crossorigin="anonymous"></script>
<script src="src/build_config.js?v=0.15.2"></script>
<script src="src/sprite_manifest.js?v=0.15.2"></script>
<script src="src/pose_manifest.js?v=0.15.2"></script>
<script src="src/data.js?v=0.15.2"></script>
<script src="src/sim.js?v=0.15.2"></script>
<script src="src/iso_fit.js?v=0.15.2"></script>
<script src="src/sprites.js?v=0.15.2"></script>
<script src="src/poses.js?v=0.15.2"></script>
<script src="src/ui.js?v=0.15.2"></script>
<script src="src/main.js?v=0.15.2"></script>
<!-- artifact:end -->
</body>
</html>
